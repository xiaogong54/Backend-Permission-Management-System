# ==========================================================================
#  pnpm workspace 成员声明
#  这个文件的存在，让 apps/* 与 packages/* 成为「同一个工作区的包」。
#  效果：
#    1. 根目录一次 pnpm install，所有成员包的依赖统一安装在根 node_modules
#    2. 成员包之间互相 import 时，pnpm 建立软链接指向本地源码，
#       而不是去 npm registry 下载 —— 改 shared 的代码，前后端立刻生效
#    3. 支持 pnpm -r（recursive）在全部成员包上批量执行脚本
# ==========================================================================
packages:
  - 'apps/*'
  - 'packages/*'
